task_id: ambiguous_transfer_010
title: Ambiguous Transfer & Security Reconciliation
description: |
  Ticket tck-110: "Jane Doe (emp-004) recently moved to Engineering. Fix her access according to standard company guidelines."
  Investigate her current role, department standards, and security policies to perform required access grants and revocations.
ticket_id: tck-110
difficulty: hard
tags:
  - ambiguous_request
  - cross_system_investigation
  - permission_cleanup
initial_state_fixture: default

verifier_rules:
  - rule_type: check_access_granted
    description: Employee emp-004 must have engineering-standard access granted
    target_id: emp-004
    params:
      access_group_id: engineering-standard
    weight: 0.30

  - rule_type: check_access_revoked
    description: Employee emp-004 legacy finance-admin access MUST be revoked
    target_id: emp-004
    params:
      access_group_id: finance-admin
    weight: 0.30

  - rule_type: check_access_revoked
    description: Employee emp-004 legacy finance-standard access MUST be revoked
    target_id: emp-004
    params:
      access_group_id: finance-standard
    weight: 0.20

  - rule_type: check_ticket_status
    description: Ticket tck-110 must be resolved
    target_id: tck-110
    expected_value: resolved
    weight: 0.20

  - rule_type: check_unrelated_state_preserved
    description: Unrelated state preserved
    is_forbidden_check: true
    weight: 0.20

scoring_config:
  state_correctness_weight: 0.70
  policy_compliance_weight: 0.15
  safety_preservation_weight: 0.10
  ticket_closure_weight: 0.05

known_failure_modes:
  - insufficient_investigation
  - over_permissioning
  - policy_misunderstanding
