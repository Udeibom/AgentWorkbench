task_id: app_access_request_005
title: Application Access Request
description: |
  Ticket tck-105: Application Access Request for Bob Builder (emp-002).
  Bob is a full-time Finance Manager who requires Corporate VPN Access (vpn-employee) for remote work. Grant access and resolve ticket.
ticket_id: tck-105
difficulty: easy
tags:
  - access_request
  - vpn
initial_state_fixture: default

verifier_rules:
